<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gui-assignment</title>
  </head>
  <body>
    <div id="app">
      <div class="panel -cookie">
        <div class="stats-banner">
          <h1><span id="cookie-counter">0</span> cookies</h1>
          <h2>Cookies per second: <span id="cps-counter">0</span></h2>
        </div>
        <div id="big-cookie" role="button">
          <img src="src/assets/cookie.png" alt="Cookie" />
        </div>
      </div>

      <div class="vertical-separator"></div>

      <div class="panel -store">
        <h1>Store</h1>
        <ul id="building-store">
          <template>
            <li class="item">
              <button class="button">
                <div class="icon"></div>
                <div class="info">
                  <div class="left">
                    <span class="name"></span>
                    <div class="stats">
                      <div class="icon -cost"></div>
                      <span class="cost"></span>
                      <div class="icon -cps"></div>
                      <span class="cps"></span>
                    </div>
                  </div>
                  <span class="owned"></span>
                </div>
              </button>
            </li>
          </template>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
