<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gui-assignment</title>
  </head>
  <body>
    <div id="app">
      <div>
        <img id="big-cookie" src="src/assets/cookie.png" />
        <h1>Cookies: <span id="counter">0</span></h1>
        <h2>Cookies per second: <span id="cps-counter">0</span></h2>
      </div>

      <div>
        <h2>Building Shop</h2>
        <ul id="building-shop">
          <template id="shop-item">
            <li>
              <button type="button">
                <span class="name"></span>
                <span class="cps"></span>
                <span class="cost"></span>
                <span class="owned"></span>
              </button>
            </li>
          </template>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
